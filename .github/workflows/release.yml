name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v1.5.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.5.0.' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify release version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "v${VERSION}" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match Info.plist version v${VERSION}." >&2
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"
      - name: Parser checks and debug build
        env:
          SKIP_LIVE_CODEX_CHECK: "1"
        run: ./scripts/test.sh
      - name: Build universal app
        run: ./scripts/build-app.sh dist
      - name: Package and verify release archive
        run: ./scripts/package-app.sh dist "${RELEASE_TAG#v}"
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: codex-meter-${{ env.RELEASE_TAG }}
          path: |
            dist/Codex-Meter-*.zip
            dist/Codex-Meter-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/Codex-Meter-${RELEASE_TAG#v}.zip" \
            "dist/Codex-Meter-${RELEASE_TAG#v}.zip.sha256" \
            --verify-tag \
            --title "Codex Meter ${RELEASE_TAG#v}" \
            --generate-notes
